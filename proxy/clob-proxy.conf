server {
    listen 80;
    server_name _;

    location / {
        # Forward requests to Polymarket's CLOB API
        proxy_pass https://clob.polymarket.com/;
        
        # Ensure the SNI and Host headers match Polymarket's expectations
        proxy_ssl_server_name on;
        proxy_set_header Host clob.polymarket.com;
        
        # Pass along the real IP (optional, but good practice)
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # Timeouts for execution reliability
        proxy_connect_timeout 10s;
        proxy_send_timeout 30s;
        proxy_read_timeout 30s;
    }
}
