<!DOCTYPE html>

    <!-- ── Structured Data ──────────────────────────────────────────── -->
    <script type="application/ld+json">
      {
        "@context": "https://schema.org",

          {
            "@type": "WebSite",

            "potentialAction": {
              "@type": "SearchAction",
              "target": {
                "@type": "EntryPoint",
                "urlTemplate": "https://poly-blocks.com/?q={search_term_string}"
              },
              "query-input": "required name=search_term_string"
            }
          },
          {
            "@type": "SoftwareApplication",
            "@id": "https://poly-blocks.com/#app",
            "name": "PolyBlocks",
            "url": "https://poly-blocks.com/",

            "operatingSystem": "Web",
            "offers": [
              {
                "@type": "Offer",
                "name": "Free",
                "price": "0",
                "priceCurrency": "USD",
                "description": "Visual strategy builder, all 31 block types, paper trading, AI builder, unlimited strategies."
              },
              {
                "@type": "Offer",
                "name": "Pro",
                "price": "1",
                "priceCurrency": "USD",

              "Live trading on Polymarket",

              "Risk management blocks",

            "aggregateRating": {
              "@type": "AggregateRating",
              "ratingValue": "4.8",
              "ratingCount": "47"
            }
          },

            "@type": "Organization",
            "@id": "https://poly-blocks.com/#org",
            "name": "PolyBlocks",
            "url": "https://poly-blocks.com/",
            "logo": {
              "@type": "ImageObject",
              "url": "https://poly-blocks.com/favicon.svg"
            },
            "contactPoint": {
              "@type": "ContactPoint",
              "email": "contact@poly-blocks.com",
              "contactType": "customer support"
            }
          }
        ]
      }

    <!-- ── Icons & Manifest ─────────────────────────────────────────── -->
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png" />
    <link rel="manifest" href="/manifest.json" />

    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
